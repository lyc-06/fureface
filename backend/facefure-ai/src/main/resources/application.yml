server:
  port: 9003

spring:
  application:
    name: facefure-ai
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/facefure?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: xxxxxxxxxx
    password: xxxxxxxxxx

  # Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      password: xxxxxxxxxx
      username: default
      database: 0

# OpenAI配置
openai:
  api-key: xxxxxxxxxx
  timeout: 30000
  models:
    - gpt-4
    - gpt-3.5-turbo

# MyBatis-Plus配置
mybatis-plus:
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml

# 日志配置
logging:
  level:
    com.facefure: debug
