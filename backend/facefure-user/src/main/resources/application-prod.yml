spring:
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://xxxxxxxxxx:3306/facefure?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false
    username: xxxxxxxxxx
    password: xxxxxxxxxx
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000
    
  # Redis配置
  data:
    redis:
      host: xxxxxxxxxx
      port: 6379
      password: xxxxxxxxxx
      username: default
      database: 0
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: -1ms
          
  # MinIO配置
  minio:
    endpoint: http://xxxxxxxxxx:9000
    access-key: xxxxxxxxxx
    secret-key: xxxxxxxxxx
    bucket: facefure
    
  # 邮件服务配置
  mail:
    host: smtp.qq.com
    port: 465
    username: xxxxxxxxxx@qq.com
    password: xxxxxxxxxx
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: true
            
# 阿里云短信配置
aliyun:
  sms:
    access-key-id: xxxxxxxxxx
    access-key-secret: xxxxxxxxxx
    endpoint: dysmsapi.aliyuncs.com
    sign-name: xxxxxxxxxx
    template-code: xxxxxxxxxx
    
# JWT配置
jwt:
  secret-key: xxxxxxxxxx
  access-token-expiration: 3600
  refresh-token-expiration: 86400

# 日志配置
logging:
  level:
    root: warn
    com.facefure: info
  file:
    name: /var/log/facefure/user.log
    
# 跨域配置
cors:
  allowed-origins: https://xxxxxxxxxx
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# 性能监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: facefure-user
